# ===================================================================
# Mini Banking System - Application Configuration
# ===================================================================
spring.application.name=mini-banking-system
server.port=8080

# Default active profile: dev (uses H2 in MySQL compatibility mode for immediate execution)
# To run against real MySQL, pass: --spring.profiles.active=mysql or set SPRING_PROFILES_ACTIVE=mysql
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# -------------------------------------------------------------------
# Security & JWT Configuration
# -------------------------------------------------------------------
# Secure HMAC-SHA256 Secret (At least 256 bits / 32 bytes base64 encoded)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -------------------------------------------------------------------
# Demo Simulation Parameters
# -------------------------------------------------------------------
app.banking.initial-demo-balance=${INITIAL_DEMO_BALANCE:1000.00}
app.banking.currency=USD

# -------------------------------------------------------------------
# OpenAPI / Swagger Documentation
# -------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
